<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Password Strength Analyzer</title>
<style>
    body { font-family: Arial, sans-serif; max-width: 500px; margin: 60px auto; }
    input { width: 100%; padding: 10px; font-size: 16px; box-sizing: border-box; }
    #meter { height: 10px; margin-top: 10px; background: #ddd; border-radius: 5px; overflow: hidden; }
    #meter-fill { height: 100%; width: 0%; transition: 0.3s; }
    ul { color: #b00020; }
    #strength-label { font-weight: bold; margin-top: 8px; }
    #crack-time { color: #555; margin-top: 5px; }
    button { margin-top: 15px; padding: 8px 16px; cursor: pointer; }
</style>
</head>
<body>
    <h2>Password Strength Analyzer</h2>
    <input type="password" id="password" placeholder="Type a password..." oninput="checkPassword()">
    <div id="meter"><div id="meter-fill"></div></div>
    <div id="strength-label"></div>
    <p id="crack-time"></p>
    <ul id="feedback"></ul>

    <button onclick="generatePassword()">Generate Strong Password</button>

<script>
async function checkPassword() {
    const password = document.getElementById("password").value;
    const response = await fetch("/check_password", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password })
    });
    const data = await response.json();

    const fill = document.getElementById("meter-fill");
    const label = document.getElementById("strength-label");
    const feedbackList = document.getElementById("feedback");
    const crackTime = document.getElementById("crack-time");

    const percent = (data.score / 5) * 100;
    fill.style.width = percent + "%";

    const colors = ["#e74c3c", "#e67e22", "#f1c40f", "#2ecc71", "#27ae60"];
    fill.style.background = colors[Math.max(data.score - 1, 0)];

    const labels = ["Very Weak", "Weak", "Fair", "Strong", "Very Strong"];
    label.textContent = password ? labels[Math.max(data.score - 1, 0)] : "";

    crackTime.textContent = password ? "Estimated crack time: " + data.crack_time : "";

    feedbackList.innerHTML = "";
    data.feedback.forEach(msg => {
        const li = document.createElement("li");
        li.textContent = msg;
        feedbackList.appendChild(li);
    });
}

async function generatePassword() {
    const res = await fetch("/generate_password");
    const data = await res.json();
    document.getElementById("password").value = data.password;
    checkPassword();
}
</script>
</body>
</html>
